name: Release

# Two entry points, one pipeline:
# - Pushing a tag vX.Y.Z that matches package.json builds every browser
#   artifact, verifies it, and publishes a GitHub Release with the store
#   archives, the source archive, and SHA-256 checksums.
# - Manual dispatch runs the same pipeline as a dry run: it builds, verifies,
#   and uploads workflow artifacts, but publishes nothing.
# When CHROME_AUTO_DEPLOY_ENABLED is "true", a tag release also submits the
# Chrome archive to the Chrome Web Store through deploy-chrome-store.yml.

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build artifacts and publish release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.context.outputs.tag }}
            version: ${{ steps.context.outputs.version }}
        env:
            # Every run that is not a tag push is a dry run.
            DRY_RUN: ${{ github.event_name != 'push' }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.10
              with:
                  version: 10.34.5
                  run_install: false
            - name: Set up Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate version and tagged commit
              id: context
              env:
                  RELEASE_REF: ${{ github.ref }}
              run: |
                  set -euo pipefail
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "package.json version is not semantic: $PACKAGE_VERSION" >&2
                    exit 1
                  fi

                  RELEASE_TAG="v$PACKAGE_VERSION"
                  if [[ "$DRY_RUN" == "false" ]]; then
                    RELEASE_TAG="${RELEASE_REF#refs/tags/}"
                    if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
                      echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION" >&2
                      exit 1
                    fi

                    git fetch origin master
                    if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
                      echo "Tagged commit must be reachable from master" >&2
                      exit 1
                    fi
                  fi

                  echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

            - name: Run quality checks
              run: pnpm check

            - name: Build release artifacts
              run: pnpm release

            - name: Assemble release archives with checksums
              env:
                  VERSION: ${{ steps.context.outputs.version }}
              run: |
                  set -euo pipefail
                  for BROWSER in chrome edge firefox; do
                    MANIFEST="dist/release/$BROWSER/manifest.json"
                    BUILT_VERSION="$(jq -r '.version' "$MANIFEST")"
                    if [[ "$BUILT_VERSION" != "$VERSION" ]]; then
                      echo "$MANIFEST version $BUILT_VERSION does not match $VERSION" >&2
                      exit 1
                    fi
                  done

                  mkdir -p release-artifacts
                  for BROWSER in chrome edge firefox; do
                    cp "dist/release/$BROWSER.zip" \
                      "release-artifacts/no-more-ago-$VERSION-$BROWSER.zip"
                  done
                  git archive --format=zip -o \
                    "release-artifacts/no-more-ago-$VERSION-source.zip" HEAD
                  (cd release-artifacts && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

            - name: Upload workflow artifacts
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: no-more-ago-${{ steps.context.outputs.version }}
                  path: release-artifacts/
                  if-no-files-found: error
                  retention-days: 30

            - name: Refuse to replace an existing release
              if: env.DRY_RUN == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.context.outputs.tag }}
              run: |
                  set -euo pipefail
                  if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "Release $RELEASE_TAG already exists" >&2
                    exit 1
                  fi

            - name: Publish GitHub release
              if: env.DRY_RUN == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.context.outputs.tag }}
                  VERSION: ${{ steps.context.outputs.version }}
              run: |
                  set -euo pipefail
                  gh release create "$RELEASE_TAG" \
                    --repo "$GITHUB_REPOSITORY" \
                    --verify-tag \
                    --title "No More Ago $VERSION" \
                    --notes "Store-ready archives for Chrome, Edge, and Firefox, the source archive, and SHA-256 checksums for No More Ago $VERSION." \
                    release-artifacts/*.zip \
                    release-artifacts/SHA256SUMS.txt

            - name: Write release summary
              if: always()
              run: |
                  if [[ -f release-artifacts/SHA256SUMS.txt ]]; then
                    {
                      if [[ "$DRY_RUN" == "true" ]]; then
                        echo "## Dry run: nothing was published"
                      else
                        echo "## Release ${{ steps.context.outputs.tag }}"
                      fi
                      echo '```'
                      cat release-artifacts/SHA256SUMS.txt
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi

    deploy-chrome:
        name: Deploy Chrome Web Store
        needs: release
        # A GitHub Release created with the workflow token never fires a
        # `release` event, so the deploy workflow is invoked directly here.
        if: github.event_name == 'push' && vars.CHROME_AUTO_DEPLOY_ENABLED == 'true'
        uses: ./.github/workflows/deploy-chrome-store.yml
        with:
            tag: ${{ needs.release.outputs.tag }}
        secrets:
            CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
            CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
            CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
            CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

name: Release

# Two entry points, one pipeline:
# - Pushing a tag vX.Y.Z that matches package.json builds every browser
#   artifact, verifies it, and publishes a GitHub Release with the store
#   archives, the source archive, and SHA-256 checksums.
# - Manual dispatch runs the same pipeline as a dry run: it builds, verifies,
#   and uploads workflow artifacts, but publishes nothing.
# When CHROME_AUTO_DEPLOY_ENABLED is "true", a tagged release also submits the
# Chrome archive to the Chrome Web Store through deploy-chrome-store.yml.
# GitHub Releases are created only here: a release created by hand for a new
# tag makes the tag run fail before anything is built.

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build artifacts and publish release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        env:
            # Every run that is not a tag push is a dry run.
            DRY_RUN: ${{ github.event_name != 'push' }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Full history brings refs/remotes/origin/master along, so
                  # the ancestry check below needs no credentialed fetch.
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate version and tagged commit
              id: context
              env:
                  RELEASE_REF: ${{ github.ref }}
              run: |
                  set -euo pipefail
                  PACKAGE_VERSION="$(jq -er '.version' package.json)"
                  if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "package.json version is not semantic: $PACKAGE_VERSION" >&2
                    exit 1
                  fi

                  RELEASE_TAG="v$PACKAGE_VERSION"
                  if [[ "$DRY_RUN" == "false" ]]; then
                    RELEASE_TAG="${RELEASE_REF#refs/tags/}"
                    if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
                      echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION" >&2
                      exit 1
                    fi
                    if ! git merge-base --is-ancestor HEAD origin/master; then
                      echo "Tagged commit must be reachable from master" >&2
                      exit 1
                    fi
                    if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      echo "Release $RELEASE_TAG already exists; delete it before publishing this tag again" >&2
                      exit 1
                    fi
                  fi

                  echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: ./.github/actions/setup-pnpm

            - name: Run quality checks
              run: pnpm check

            - name: Build release artifacts
              run: pnpm release

            - name: Assemble release archives with checksums
              env:
                  VERSION: ${{ steps.context.outputs.version }}
              run: |
                  set -euo pipefail
                  mkdir -p release-artifacts
                  # One archive per browser target the build produced.
                  for ZIP in dist/release/*.zip; do
                    BROWSER="$(basename "$ZIP" .zip)"
                    MANIFEST="dist/release/$BROWSER/manifest.json"
                    BUILT_VERSION="$(jq -er '.version' "$MANIFEST")"
                    if [[ "$BUILT_VERSION" != "$VERSION" ]]; then
                      echo "$MANIFEST version $BUILT_VERSION does not match $VERSION" >&2
                      exit 1
                    fi
                    cp "$ZIP" "release-artifacts/no-more-ago-$VERSION-$BROWSER.zip"
                  done
                  git archive --format=zip -o "release-artifacts/no-more-ago-$VERSION-source.zip" HEAD
                  (cd release-artifacts && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

            - name: Upload workflow artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: no-more-ago-${{ steps.context.outputs.version }}
                  path: release-artifacts/
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish GitHub Release
              if: env.DRY_RUN == 'false'
              env:
                  RELEASE_TAG: ${{ steps.context.outputs.tag }}
                  VERSION: ${{ steps.context.outputs.version }}
              run: |
                  set -euo pipefail
                  # The release starts as a draft so a failed asset upload leaves
                  # a draft, which the store deployment refuses, instead of a
                  # published release without archives.
                  gh release create "$RELEASE_TAG" \
                    --repo "$GITHUB_REPOSITORY" \
                    --draft \
                    --verify-tag \
                    --title "No More Ago $VERSION" \
                    --notes "Store-ready archives for Chrome, Edge, and Firefox, the source archive, and SHA-256 checksums." \
                    --generate-notes \
                    release-artifacts/*.zip \
                    release-artifacts/SHA256SUMS.txt
                  gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

            - name: Write release summary
              if: always()
              env:
                  RELEASE_TAG: ${{ steps.context.outputs.tag }}
              run: |
                  set -euo pipefail
                  if [[ -f release-artifacts/SHA256SUMS.txt ]]; then
                    {
                      if [[ "$DRY_RUN" == "true" ]]; then
                        echo "## Dry run: nothing was published"
                      else
                        echo "## Release $RELEASE_TAG"
                      fi
                      echo '```'
                      cat release-artifacts/SHA256SUMS.txt
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi

    deploy-chrome:
        name: Deploy Chrome Web Store
        needs: release
        # A GitHub Release created with the workflow token never fires a
        # `release` event, so the deploy workflow is invoked directly here.
        if: github.event_name == 'push' && vars.CHROME_AUTO_DEPLOY_ENABLED == 'true'
        uses: ./.github/workflows/deploy-chrome-store.yml
        with:
            tag: ${{ github.ref_name }}
        secrets:
            CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
            CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
            CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
            CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

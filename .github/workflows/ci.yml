name: CI

on:
    pull_request:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.10
              with:
                  version: 10.34.5
                  run_install: false
            - name: Set up Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run lint
              run: pnpm lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.10
              with:
                  version: 10.34.5
                  run_install: false
            - name: Set up Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run type checking
              run: pnpm typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.10
              with:
                  version: 10.34.5
                  run_install: false
            - name: Set up Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run tests
              run: pnpm test

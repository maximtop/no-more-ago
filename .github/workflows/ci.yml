name: CI

on:
    pull_request:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up pnpm
              uses: ./.github/actions/setup-pnpm
            - name: Run lint
              run: pnpm lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up pnpm
              uses: ./.github/actions/setup-pnpm
            - name: Run type checking
              run: pnpm typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up pnpm
              uses: ./.github/actions/setup-pnpm
            - name: Run tests
              run: pnpm test

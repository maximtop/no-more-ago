name: Site report
description: Report missing or broken date support
title: "[Site report] "
body:
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      description: Choose the closest description of the problem.
      options:
        - Add support for this site
        - Dates are not working correctly
    validations:
      required: true
  - type: input
    id: current_url
    attributes:
      label: Page URL
      description: Full address of the page where you saw the problem, if any.
  - type: input
    id: extension_version
    attributes:
      label: Extension version
  - type: input
    id: browser
    attributes:
      label: Browser
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
      placeholder: Describe what you saw.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result.

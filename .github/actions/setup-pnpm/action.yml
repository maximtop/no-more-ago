name: Set up pnpm
description: Install pnpm from package.json, Node.js with the pnpm cache, and the pinned dependency graph

runs:
    using: composite
    steps:
        - name: Install pnpm
          uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
          with:
              run_install: false
        - name: Set up Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version: 24
              cache: pnpm
        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile

name: Set up toolchain and dependencies
description: >-
    Install pnpm and Node.js at the versions package.json declares, with the
    pnpm cache, then the pinned dependency graph

runs:
    using: composite
    steps:
        - name: Install pnpm
          uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        - name: Set up Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version-file: package.json
              cache: pnpm
        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
